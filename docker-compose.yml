version: '3.8'

services:
  sap_hana_lp:
    image: dvconsultores/sap_hana_lp:latest
    container_name: sap_hana_lp
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    env_file:
      - .env
    command: ["python3", "app.py"]

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-test
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=30
      - WATCHTOWER_DEBUG=true