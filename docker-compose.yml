services:
  mockba:
    build: .
    container_name: sap_hana_lp
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    env_file:
      - .env
    command: ["/usr/local/bin/vpn_setup.sh"]

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-test
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  vpn:
    build:
      context: .
    container_name: vpn-service
    cap_add:
      - NET_ADMIN
    volumes:
      - /etc/NetworkManager:/etc/NetworkManager
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["/usr/local/bin/vpn_connect.sh"]
    network_mode: host  # Important for VPN to work on host network
